# Afterglow models.lock — pinned external artefacts (TOML, read by install.sh / setup-lumen.sh / download.sh).
#
# sha256 = "TODO-verify-on-first-download" means: no published checksum could be fetched when this file was
# written.  download.sh computes the sha256 after the first download, prints it and writes it back here; every
# later run then verifies against it.  Review the recorded value (compare with the "Git LFS" hash on the
# Hugging Face file page) before trusting it.

[lumen]
# LUMEN RAW (MIT).  Source: https://github.com/hety0211/lumen-raw  (checked out read-only at this commit)
repo   = "https://github.com/hety0211/lumen-raw.git"
commit = "f752bb40127de1c0d8cb36853ea1fa873291d019"

[llama_cpp]
# Source: https://github.com/ggml-org/llama.cpp.git (clone URL as shown on the Qwen3-VL-4B-Instruct-GGUF model card)
# Tag b9951 exists as a release (https://newreleases.io/project/github/ggml-org/llama.cpp/release/b9951).
# download.sh falls back to the default branch if the tag cannot be checked out.
repo = "https://github.com/ggml-org/llama.cpp.git"
tag  = "b9951"

# ---- Vision model (required): Qwen3-VL-4B-Instruct, official Qwen GGUF repo ----
# File list verified at https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/tree/main
# URLs use the standard Hugging Face "resolve/main" pattern.
[[model]]
name     = "vision"
role     = "llm"
required = true
file     = "Qwen3VL-4B-Instruct-Q4_K_M.gguf"      # 2.5 GB
url      = "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
sha256   = "TODO-verify-on-first-download"

[[model]]
name     = "vision"
role     = "mmproj"
required = true
file     = "mmproj-Qwen3VL-4B-Instruct-F16.gguf"   # 836 MB (a Q8_0 variant, 454 MB, also exists in the repo)
url      = "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-4B-Instruct-F16.gguf"
sha256   = "TODO-verify-on-first-download"

# ---- Brain model (optional, --with-brain): Qwen3.6-35B-A3B, unsloth GGUF repo ----
# File list verified at https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/tree/main
# (unsloth names the Q4_K_M file "...-UD-Q4_K_M.gguf" = Unsloth Dynamic quant).
[[model]]
name     = "brain"
role     = "llm"
required = false
file     = "Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"        # 22.1 GB
url      = "https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
sha256   = "TODO-verify-on-first-download"

[[model]]
name     = "brain"
role     = "mmproj"
required = false
file     = "mmproj-Qwen3.6-35B-A3B-F16.gguf"       # saved name; remote file is mmproj-F16.gguf (899 MB)
remote   = "mmproj-F16.gguf"
url      = "https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/mmproj-F16.gguf"
sha256   = "TODO-verify-on-first-download"
